# Supplement: the SIG GSS repository has no document for this characteristic.
# Source: Audio Input Control Service 1.0.1, Section 3.4 (Table 3.4).
characteristic:
  identifier: org.bluetooth.characteristic.audio_input_status
  name: Audio Input Status
  description: |-
    The Audio Input Status characteristic shall be set to a value that reflects the current state of the audio input. The Audio Input Status is a one-octet value that shall have one of the non-RFU values defined in Table 3.4.
    The structure of this characteristic is defined below.
  structure:
    - field: Audio Input Status
      type: uint8
      size: "1"
      description: See \autoref{sec:org.bluetooth.characteristic.audio_input_status/field/audio_input_status}.
  fields:
    - name: Audio Input Status
      description: The values of this field are defined below.
      values:
        - value: "0x00"
          description: Inactive
        - value: "0x01"
          description: Active
        - value: 0x02–0xFF
          description: Reserved for Future Use
