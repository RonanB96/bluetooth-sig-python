# Supplement: the SIG GSS repository has no document for this characteristic.
# Source: Hearing Access Service 1.0.1, Section 3.3.
characteristic:
  identifier: org.bluetooth.characteristic.active_preset_index
  name: Active Preset Index
  description: |-
    The Active Preset Index characteristic exposes the Index field of the active preset record, or the value 0x00 if no preset is active (see Table 1.2).
    The structure of this characteristic is defined below.
  structure:
    - field: Active Preset Index
      type: uint8
      size: "1"
      description: |-
        Allowed range is: 0x01 to 0xFF.
        A value of 0x00 represents "no preset is active".
