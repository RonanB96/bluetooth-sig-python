# Supplement: the SIG GSS repository has no document for this characteristic.
# Source: Constant Tone Extension Service 1.0, 3.3 Advertising Constant Tone Extension Minimum Transmit Count (Table 3.4).
characteristic:
  identifier: org.bluetooth.characteristic.advertising_constant_tone_extension_minimum_transmit_count
  name: Advertising Constant Tone Extension Minimum Transmit Count
  description: |-
    The Advertising Constant Tone Extension Minimum Transmit Count characteristic is a control-point attribute that stores the minimum number of times the server transmits Constant Tone Extension packets on the advertising channels at each Constant Tone Extension Interval.
    The structure of this characteristic is defined below.
  structure:
    - field: Advertising Constant Tone Extension Minimum Transmit Count
      type: uint8
      size: "1"
      description: See \autoref{sec:org.bluetooth.characteristic.advertising_constant_tone_extension_minimum_transmit_count/field/advertising_constant_tone_extension_minimum_transmit_count}.
  fields:
    - name: Advertising Constant Tone Extension Minimum Transmit Count
      description: The values of this field are defined below.
      values:
        - value: 1–15
          description: Minimum times a packet with the Constant Tone Extension is transmitted at each Constant Tone Extension Interval
        - value: 16–255
          description: Reserved for Future Use
