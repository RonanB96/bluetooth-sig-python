# Supplement: the SIG GSS repository has no document for this characteristic.
# Source: Volume Offset Control Service 1.0.1, 3.1 Volume Offset State (Table 3.2), 2.2.1.1 Volume_Offset field, and 2.2.1.2 Change_Counter field.
characteristic:
  identifier: org.bluetooth.characteristic.volume_offset_state
  name: Volume Offset State
  description: |-
    The Volume Offset State characteristic shall be used to reflect the state of the audio volume to which this service applies.
    The structure of this characteristic is defined below.
  structure:
    - field: Volume_Offset
      type: sint16
      size: "2"
      description: |-
        Reflects the current offset that is applied to the volume of the audio output to which this service applies.
        Unit is unitless.
    - field: Change_Counter
      type: uint8
      size: "1"
      description: |-
        Incremented by 1 when the Volume_Offset field value changes.
        Allowed range is 0 to 255.
        When the Change_Counter field value reaches 255, its next increment shall be 0.
