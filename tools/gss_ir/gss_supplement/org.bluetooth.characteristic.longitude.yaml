# Supplement: the SIG GSS repository has no document for this characteristic.
# Source: Indoor Positioning Service 1.0, Section 3.3.
characteristic:
  identifier: org.bluetooth.characteristic.longitude
  name: Longitude
  description: |-
    The Longitude Characteristic describes the global WGS84 East coordinate [5] of the device.
    Longitude is based on WGS84 [5] datum. The relation between the Longitude X in range [-180°, 180°] and the encoded (transmitted) number N is N = floor((X / 180) * 2^31), where N is bounded to the range -2^31 + 1 ≤ N ≤ 2^31 - 1. If N exceeds the bounds, the closest value within the bounds shall be used. The floor operation shall be performed according to [4].
    The structure of this characteristic is defined below.
  structure:
    - field: Longitude
      type: signed_magnitude32
      size: "4"
      description: |-
        Signed integer of size 32 bits encoded as signed magnitude.
        Allowed range is: -2147483647 to 2147483647.
        A value of 0x80000000 represents "Longitude characteristic is not configured".
