# Supplement: the SIG GSS repository has no document for this characteristic.
# Source: Volume Control Service 1.0.1, 3.1 Volume State (Table 3.2) and 2.3.1.2 Mute field.
characteristic:
  identifier: org.bluetooth.characteristic.volume_state
  name: Volume State
  description: |-
    The Volume State characteristic is used to reflect the state of the audio volume to which the service applies.
    The structure of this characteristic is defined below.
  structure:
    - field: Volume Setting
      type: uint8
      size: "1"
      description: |-
        Reflects the volume of the audio to which the service applies.
        Allowed range is 0 to 255.
        0 is the minimum volume output and 255 is the maximum volume output.
    - field: Mute
      type: uint8
      size: "1"
      description: Reflects the current mute state of the audio to which the service applies.
    - field: Change Counter
      type: uint8
      size: "1"
      description: |-
        Incremented by 1 when the Volume Setting or Mute field value changes.
        Allowed range is 0 to 255.
        After 255 the next increment is 0.
  fields:
    - name: Mute
      description: The values of this field are defined below.
      values:
        - value: "0x00"
          description: Not Muted
        - value: "0x01"
          description: Muted
