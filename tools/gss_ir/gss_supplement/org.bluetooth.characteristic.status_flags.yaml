# Supplement: the SIG GSS repository has no document for this characteristic.
# Source: Telephone Bearer Service 1.0, Section 3.9 (Table 3.3).
characteristic:
  identifier: org.bluetooth.characteristic.status_flags
  name: Status Flags
  description: |-
    The Status Flags characteristic is 2 octets and returns the current status of features that the server device supports. Table 3.3 describes the definitions of the bit fields that are used by the server to indicate various features of the server that are enabled or disabled. The RFU bits shall be set to 0.
    The structure of this characteristic is defined below.
  structure:
    - field: Status Flags
      type: boolean[16]
      size: "2"
      description: See \autoref{sec:org.bluetooth.characteristic.status_flags/field/status_flags}.
  fields:
    - name: Status Flags
      description: The bits of this field are defined below.
      values:
        - bit: "0"
          description: |-
            Inband ringtone
            0 = inband ringtone disabled
            1 = inband ringtone enabled
        - bit: "1"
          description: |-
            Silent mode
            0 = Server is not in silent mode
            1 = Server is in silent mode
        - bit: 2–15
          description: Reserved for Future Use
