# Supplement: the SIG GSS repository has no document for this characteristic.
# Source: Transport Discovery Service 1.1, 5.1 BR-EDR Handover Data characteristic (Tables 5.2–5.3).
characteristic:
  identifier: org.bluetooth.characteristic.br_edr_handover_data
  name: BR-EDR Handover Data
  description: |-
    The BR-EDR Handover Data characteristic consists of several fields, such as Bluetooth Device Address (BD_ADDR), to facilitate a quick connection over the BR/EDR transport when required.
    The structure of this characteristic is defined below.
  structure:
    - field: BR-EDR Features
      type: boolean[8]
      size: "1"
      description: See \autoref{sec:org.bluetooth.characteristic.br_edr_handover_data/field/br-edr_features}.
    - field: BD_ADDR
      type: uint48
      size: "6"
      description: This 6-octet field contains the BD_ADDR of the device.
    - field: Class of Device
      type: uint24
      size: "3"
      description: The format and values are defined in the Bluetooth SIG Assigned Numbers \RefRef{assigned_numbers}.
  fields:
    - name: BR-EDR Features
      description: The bits of this field are defined below.
      values:
        - bit: 0–7
          description: Reserved for Future Use
