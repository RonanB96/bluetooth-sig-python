# Supplement: the SIG GSS repository has no document for this characteristic.
# Source: HTTP Proxy Service 1.0, 3.1 URI Characteristic.
characteristic:
  identifier: org.bluetooth.characteristic.uri
  name: URI
  description: |-
    The URI characteristic is used to configure the URI for a subsequent request.
    The URI characteristic shall contain the URI to be used in the HTTP request as a UTF-8 string (utf8s), up to the maximum characteristic length defined.
    Current version of the spec supports HTTP request with URI up to 512 octets in length.
    The structure of this characteristic is defined below.
  structure:
    - field: URI
      type: utf8s
      size: variable
      description: UTF-8 string
