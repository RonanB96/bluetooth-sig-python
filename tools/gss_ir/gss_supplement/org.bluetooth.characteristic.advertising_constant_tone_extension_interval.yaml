# Supplement: the SIG GSS repository has no document for this characteristic.
# Source: Constant Tone Extension Service 1.0, 3.5 Advertising Constant Tone Extension Interval (Table 3.6).
characteristic:
  identifier: org.bluetooth.characteristic.advertising_constant_tone_extension_interval
  name: Advertising Constant Tone Extension Interval
  description: |-
    The Advertising Constant Tone Extension Interval characteristic is a control-point attribute that stores the interval at which the server transmits packets containing a Constant Tone Extension on the advertising channels.
    The structure of this characteristic is defined below.
  structure:
    - field: Advertising Constant Tone Extension Interval
      type: uint16
      size: "2"
      description: See \autoref{sec:org.bluetooth.characteristic.advertising_constant_tone_extension_interval/field/advertising_constant_tone_extension_interval}.
  fields:
    - name: Advertising Constant Tone Extension Interval
      description: The values of this field are defined below.
      values:
        - value: 0x0000–0x0005
          description: Reserved for Future Use
        - value: 0x0006–0xFFFF
          description: |-
            The interval at which the server transmits packets containing a Constant Tone Extension on the advertising channels is given by the value N*1.25 ms, with N being the raw 16-bit value.
            Time Range: 7.5 ms to 81.91875 s
