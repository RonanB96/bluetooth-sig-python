# Supplement: the SIG GSS repository has no document for this characteristic.
# Source: Physical Activity Monitor Service 1.0, Section 3.9 (Tables 3.21–3.30).
characteristic:
  identifier: org.bluetooth.characteristic.physical_activity_monitor_control_point
  name: Physical Activity Monitor Control Point
  description: |-
    The Physical Activity Monitor Control Point characteristic is used to request a specific procedure to be executed by the server when a value is written to it using the GATT Write Characteristic Value sub-procedure.
    A procedure is triggered by writing a value that includes an opcode specifying the operation. This might require a parameter that is valid within the context of that opcode, as specified in Section 3.9.1.1.
    The structure of this characteristic is defined below.
  structure:
    - field: Op Code
      type: uint8
      size: "1"
      description: See \autoref{sec:org.bluetooth.characteristic.physical_activity_monitor_control_point/field/op_code}
    - field: Session ID
      type: uint16
      size: "2"
      description: |-
        Allowed range is: 0x0000 to 0xFFFE. Data is requested for the session identified by the Session ID parameter.
        A value of 0xFFFF is RFU.
        Present if Op Code is 0x02 or 0x06 or 0x03
    - field: Sub-session ID
      type: uint16
      size: "2"
      description: |-
        Allowed range is: 0x0000 to 0xFFFE. Data is requested for the sub-session identified by the Sub-session ID parameter.
        A value of 0xFFFF indicates that data is requested for all sub-sessions of the session identified by the Session ID parameter.
        Present if Op Code is 0x03
    - field: Data Characteristic
      type: uint8
      size: "1"
      description: |-
        See \autoref{sec:org.bluetooth.characteristic.physical_activity_monitor_control_point/field/data_characteristic}.
        Present if Op Code is 0x03
    - field: Type
      type: uint8
      size: "1"
      description: |-
        See \autoref{sec:org.bluetooth.characteristic.physical_activity_monitor_control_point/field/type}.
        Present if Op Code is 0x04
    - field: Scope
      type: uint8
      size: "1"
      description: |-
        See \autoref{sec:org.bluetooth.characteristic.physical_activity_monitor_control_point/field/scope}.
        Present if Op Code is 0x07
    - field: User-Defined Activity Type
      type: uint8
      size: "1"
      description: |-
        This parameter value indicates the value with which the User-Defined sub-field of the average activity type shall be set. See Section 3.2.1.1.17 for the description of activity type values.
        See \autoref{sec:org.bluetooth.characteristic.physical_activity_monitor_control_point/field/user-defined_activity_type}.
        Present if Op Code is 0x07
    - field: Number of reported sessions
      type: uint16
      size: "2"
      description: |-
        A value of 0x0000 is RFU.
        Allowed range is: 0x0001 to 0xFFFF. Number of reported sessions.
        Present if Op Code is 0xFC
    - field: Number of reported sub-sessions
      type: uint16
      size: "2"
      description: |-
        A value of 0x0000 is RFU.
        Allowed range is: 0x0001 to 0xFFFF. Number of reported sub-sessions.
        Present if Op Code is 0xFB
    - field: Number of reported Data Records
      type: uint24
      size: "3"
      description: |-
        A value of 0x000000 is RFU.
        Allowed range is: 0x000001 to 0xFFFFFF. Number of reported Data Records.
        Present if Op Code is 0xFA
    - field: Parameter
      type: uint8
      size: "1"
      description: |-
        A value of 0xFF represents Undetermined Error.
        All other values are RFU.
        Present if Op Code is 0xFD or 0xFE or 0xFF
  fields:
    - name: Op Code
      description: The values of this field are defined below.
      section_title: Physical Activity Monitor Control Point characteristic—opcodes
      table_caption: Physical Activity Monitor Control Point characteristic—opcodes
      values:
        - op_code_value: "0x00"
          requirement: N/A
          definition: Reserved for Future Use
          parameter_value: N/A
          description: N/A
        - op_code_value: "0x01"
          requirement: M
          definition: Enquire Sessions
          parameter_value: None
          description: |-
            Request information about all sessions stored in the database of the server. This means that all stored sessions must be listed in the Physical Activity Session Descriptor characteristic. See Section 3.9.1.1.1 for details.
        - op_code_value: "0x02"
          requirement: M
          definition: Enquire Sub-sessions
          parameter_value: Session ID (uint16)
          description: |-
            Request information about all sub-sessions that comprise the session identified by the Session ID parameter. This means that all stored sub-sessions must be listed in the Physical Activity Session Descriptor characteristic. See Section 3.9.1.1.2 for details.
        - op_code_value: "0x03"
          requirement: M
          definition: Get Ended Session Data
          parameter_value: Data Request Specification, see Section 3.9.1.1.3
          description: |-
            Request to receive the data associated with the ended session/sub-session indicated by the Data Request Specification parameter. See Section 3.9.1.1.3 for details.
        - op_code_value: "0x04"
          requirement: M
          definition: Start Session/Sub-session
          parameter_value: Type (8 bit)
          description: |-
            Request the start of a new session or sub-session as specified by the Type parameter. This means that the current session/sub-session must end at the point in time at which the requested new session/sub-session starts. See Section 3.9.1.1.4 for details.
        - op_code_value: "0x05"
          requirement: M
          definition: Stop Session
          parameter_value: None
          description: Request the current session to stop running. See Section 3.9.1.1.5 for details.
        - op_code_value: "0x06"
          requirement: M
          definition: Delete Ended Session
          parameter_value: Session ID (uint16)
          description: |-
            Request the deletion of the session identified by the Session ID parameter from the database of the server, including all its sub-sessions. See Section 3.9.1.1.6 for details.
        - op_code_value: "0x07"
          requirement: C.1
          definition: Set Average Activity Type
          parameter_value: Set Average Activity Type Specification, see Section 3.9.1.1.7
          description: Request to set average activity type of current session/sub-session. See Section 3.9.1.1.7 for details.
        - op_code_value: 0x08–0xF9
          requirement: N/A
          definition: Reserved for Future Use
          parameter_value: N/A
          description: N/A
        - op_code_value: "0xFA"
          requirement: M
          definition: Get Ended Session Data Success Response
          parameter_value: See Section 3.9.1.1.3
          description: |-
            May be sent to the client in an indication of the Physical Activity Monitor Control Point characteristic. See Section 3.9.1.1.3 for details.
        - op_code_value: "0xFB"
          requirement: M
          definition: Enquire Sub-sessions Success Response
          parameter_value: See Section 3.9.1.1.2
          description: |-
            May be sent to the client in an indication of the Physical Activity Monitor Control Point characteristic. See Section 3.9.1.1.2 for details.
        - op_code_value: "0xFC"
          requirement: M
          definition: Enquire Sessions Success Response
          parameter_value: See Section 3.9.1.1.1
          description: |-
            May be sent to the client in an indication of the Physical Activity Monitor Control Point characteristic. See Section 3.9.1.1.1 for details.
        - op_code_value: "0xFD"
          requirement: M
          definition: Get Ended Session Data Error Response
          parameter_value: See Section 3.9.3.5
          description: |-
            May be sent to the client in an indication of the Physical Activity Monitor Control Point characteristic. See Section 3.9.1.1.3 and Section 3.9.3.5 for details.
        - op_code_value: "0xFE"
          requirement: M
          definition: Enquire Sub-sessions Error Response
          parameter_value: See Section 3.9.3.4
          description: |-
            May be sent to the client in an indication of the Physical Activity Monitor Control Point characteristic. See Section 3.9.1.1.2 and Section 3.9.3.4 for details.
        - op_code_value: "0xFF"
          requirement: M
          definition: Enquire Sessions Error Response
          parameter_value: See Section 3.9.3.3
          description: |-
            May be sent to the client in an indication of the Physical Activity Monitor Control Point characteristic. See Section 3.9.1.1.1 and Section 3.9.3.3 for details.
    - name: Data Characteristic
      description: The values of this field are defined below.
      values:
        - value: "0x00"
          description: Data is requested for the General Activity Instantaneous Data characteristic. See Section 3.2.
        - value: "0x01"
          description: Data is requested for the General Activity Summary Data characteristic. See Section 3.3.
        - value: "0x02"
          description: Data is requested for the CardioRespiratory Activity Instantaneous Data characteristic. See Section 3.4.
        - value: "0x03"
          description: Data is requested for the CardioRespiratory Activity Summary Data characteristic. See Section 3.5.
        - value: "0x04"
          description: Data is requested for the Step Counter Activity Summary Data characteristic. See Section 3.6.
        - value: "0x05"
          description: Data is requested for the Sleep Activity Instantaneous Data characteristic. See Section 3.7.
        - value: "0x06"
          description: Data is requested for the Sleep Activity Summary Data characteristic. See Section 3.8.
        - value: 0x07–0xFF
          description: RFU.
    - name: Type
      description: The values of this field are defined below.
      values:
        - value: "0x00"
          description: This parameter value indicates that a session shall be started.
        - value: "0x01"
          description: This parameter value indicates that a sub-session shall be started.
        - value: 0x02–0xFF
          description: RFU.
    - name: Scope
      description: The values of this field are defined below.
      values:
        - value: "0x00"
          description: This parameter value indicates that the request concerns only the current sub-session.
        - value: "0x01"
          description: This parameter value indicates that the request concerns all sub-sessions within the current session.
        - value: 0x02–0xFF
          description: RFU.
    - name: User-Defined Activity Type
      description: The values of this field are defined below.
      values:
        - value: "0x00"
          description: Unspecified
        - value: "0x01"
          description: Other
        - value: "0x02"
          description: Sit
        - value: "0x03"
          description: Lie
        - value: "0x04"
          description: Stand
        - value: "0x05"
          description: Walk. Includes hiking.
        - value: "0x06"
          description: Shuffle
        - value: "0x07"
          description: Run. Includes jogging.
        - value: "0x08"
          description: Cycle indoor
        - value: "0x09"
          description: Cycle outdoor
        - value: "0x0A"
          description: Cycle
        - value: "0x0B"
          description: Aerobic workout. Continuous, high-paced activity such as dance or kickboxing.
        - value: "0x0C"
          description: Elliptical. Activity performed on an elliptical trainer, elliptical glider, or elliptical cross trainer.
        - value: "0x0D"
          description: Sports. Continuous, high-paced activity such as tennis, soccer, or basketball.
        - value: "0x0E"
          description: Swim
        - value: 0x0F–0xFE
          description: RFU
        - value: "0xFF"
          description: Unknown. Activity is unknown.
