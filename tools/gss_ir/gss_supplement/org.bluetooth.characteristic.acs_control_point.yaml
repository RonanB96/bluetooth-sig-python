# Supplement: the SIG GSS repository has no document for this characteristic.
# Source: Authorization Control Service 1.0, Section 4.4 ACS Control Point (Tables 4.11–4.78).
characteristic:
  identifier: org.bluetooth.characteristic.acs_control_point
  name: ACS Control Point
  description: |-
    The ACS Control Point (CP) provides procedures to assist the AC Client in determining the details of the information security controls and mapping information security controls to protected GATT resources and supported key exchange methods. The ACS CP also provides the AC Client the ability to invalidate the established security, to exchange a key, to request a list of restriction map IDs, to activate a restriction map, and/or to set the state of the security controls switch.
    The structure of this characteristic is defined below.
  structure:
    - field: Segmentation_Header
      type: struct
      size: "1"
      description: See \autoref{sec:org.bluetooth.characteristic.acs_control_point/field/segmentation_header}.
    - field: Opcode
      type: uint8
      size: "1"
      description: See \autoref{sec:org.bluetooth.characteristic.acs_control_point/field/opcode}.
    - field: Operand
      type: struct
      size: Variable
      description: |-
        The Payload field is composed of the Opcode and Operand fields (see Table 4.12).
        Present for the Opcode as defined in Table 4.13; otherwise excluded.
        See \autoref{sec:org.bluetooth.characteristic.acs_control_point/field/acs_cp_procedure_requirements}.
  fields:

    - name: Segmentation_Header
      description: The bits of this field are defined below.
      values:
        - bit: "0"
          description: |-
            First Segment
            0 = This segment is not the first segment of the segmented payload.
            1 = This segment of the segmented payload is the first segment.
        - bit: "1"
          description: |-
            Last Segment
            0 = This segment is not the last segment of the segmented payload.
            1 = This segment of the segmented payload is the last segment.
        - bit: 2–7
          description: |-
            Rolling Segment Counter
            Unsigned integer value between 0 and 63; incremented by one with each segment; rolls over from 63 to 0.

    - name: Opcode
      description: The values of this field are defined below.
      section_title: ACS CP Opcode values
      table_caption: ACS CP Opcode values
      values:
        - op_code_value: "0x00"
          definition: Response Code
          operand_section: 4.4.4.1
          description: General response from the ACS CP to state procedure errors. Also used for successful procedures if the response for the procedure does not require parameters specific to the request.
        - op_code_value: "0x01"
          definition: Get All Active Descriptors
          operand_section: 4.4.4.2
          description: Triggers the procedures that report ACS descriptors that are active in a single request.
        - op_code_value: "0x02"
          definition: Get Restriction Map Descriptor
          operand_section: 4.4.4.3
          description: Gets the restriction map based on the restriction map ID and filter criterion, if provided and as applicable.
        - op_code_value: "0x03"
          definition: Restriction Map Descriptor Response
          operand_section: 4.4.4.4
          description: Used by the AC Server to provide a restriction map.
        - op_code_value: "0x04"
          definition: Get Restriction Map ID List
          operand_section: 4.4.4.5
          description: Gets a list of restriction map IDs that identify all available restriction maps.
        - op_code_value: "0x05"
          definition: Restriction Map ID List Response
          operand_section: 4.4.4.6
          description: Used by the AC Server to provide the restriction map ID list.
        - op_code_value: "0x06"
          definition: Activate Restriction Map
          operand_section: 4.4.4.7
          description: Activates the restriction map identified by the included restriction map ID.
        - op_code_value: "0x07"
          definition: Get Resource Handle To UUID Map
          operand_section: 4.4.4.8
          description: Gets the map between Resource Handles and UUIDs.
        - op_code_value: "0x08"
          definition: Resource Handle To UUID Map Response
          operand_section: 4.4.4.9
          description: Used by the AC Server to provide the map between Resource Handles and UUIDs.
        - op_code_value: "0x09"
          definition: Get Service And Characteristic UUIDs For Characteristic Resource Handle
          operand_section: 4.4.4.10
          description: Gets the service and characteristic UUIDs for a requested resource handle.
        - op_code_value: "0x0A"
          definition: Service And Characteristic UUIDs For Characteristic Resource Handle Response
          operand_section: 4.4.4.11
          description: Used by the AC Server to provide the service and characteristic UUIDs for the request resource handle.
        - op_code_value: "0x0B"
          definition: Get Information Security Configuration Descriptor
          operand_section: 4.4.4.12
          description: Gets the information security configurations based on the filter criterion, if provided and as applicable.
        - op_code_value: "0x0C"
          definition: Information Security Configuration Descriptor Response
          operand_section: 4.4.4.13
          description: Used by the AC Server to provide the information security configurations.
        - op_code_value: "0x0D"
          definition: Get Key Descriptor
          operand_section: 4.4.4.14
          description: Requests the supported key exchange methods based on the filter criterion, if provided and as applicable.
        - op_code_value: "0x0E"
          definition: Key Descriptor Response
          operand_section: 4.4.4.15
          description: Used by the AC Server to provide the supported key exchange methods.
        - op_code_value: "0x0F"
          definition: Get Current Key List
          operand_section: 4.4.4.16
          description: Requests the list of key IDs that are valid.
        - op_code_value: "0x10"
          definition: Current Key List Response
          operand_section: 4.4.4.17
          description: Used by the AC Server to provide a list of the current keys.
        - op_code_value: "0x11"
          definition: Start Key Exchange
          operand_section: 4.4.4.18
          description: Requests the start of key exchange for the included key ID.
        - op_code_value: "0x12"
          definition: Key Exchange Response
          operand_section: 4.4.4.19
          description: Used by the AC Server to provide the results of the key exchange.
        - op_code_value: "0x13"
          definition: Invalidate All Established Security
          operand_section: 4.4.4.20
          description: Invalidates all of the established security for all AC Clients.
        - op_code_value: "0x14"
          definition: Invalidate Key
          operand_section: 4.4.4.21
          description: Invalidates one or more keys for the requesting AC Client.
        - op_code_value: "0x15"
          definition: Abort
          operand_section: 4.4.4.22
          description: Stops any ACS CP procedure that is in progress.
        - op_code_value: "0x16"
          definition: Set Security Controls Switch
          operand_section: 4.4.4.23
          description: Sets the state of the security controls switch to turn on or to turn off security controls provided by ACS.
        - op_code_value: "0x17"
          definition: Get Key URI
          operand_section: 4.4.4.24
          description: Requests the URI that can be used to get the AC Server key.
        - op_code_value: "0x18"
          definition: Key URI Response
          operand_section: 4.4.4.25
          description: Used by the AC Server to provide the key URI.
        - op_code_value: "0x19"
          definition: Get ACS Feature
          operand_section: 4.4.4.26
          description: Requests the features and capabilities supported by the AC Server.
        - op_code_value: "0x1A"
          definition: ACS Feature Response
          operand_section: 4.4.4.27
          description: Used by the AC Server to provide the supported features and capabilities.
        - op_code_value: "0x1B"
          definition: Key Exchange ECDH
          operand_section: 4.4.4.28
          description: Requests the exchange of public keys as part of the ECDH key agreement scheme.
        - op_code_value: "0x1C"
          definition: Key Exchange ECDH Response
          operand_section: 4.4.4.29
          description: Used by the AC Server to provide the AC Server public key as part of the ECDH key agreement scheme.
        - op_code_value: "0x1D"
          definition: Key Exchange ECDH Confirmation Code
          operand_section: 4.4.4.30
          description: Requests the exchange of confirmation codes to validate the exchanged key as part of the ECDH key agreement scheme.
        - op_code_value: "0x1E"
          definition: Key Exchange ECDH Confirmation Code Response
          operand_section: 4.4.4.31
          description: Used by the AC Server to provide the AC Server confirmation code as part of the ECDH key agreement scheme.
        - op_code_value: "0x1F"
          definition: Key Exchange ECDH Confirmation Random Number
          operand_section: 4.4.4.32
          description: Requests the exchange of random numbers generated to calculate the ECDH confirmation code as part of the ECDH key agreement scheme.
        - op_code_value: "0x20"
          definition: Key Exchange ECDH Confirmation Random Number Response
          operand_section: 4.4.4.33
          description: Used by the AC Server to provide the AC Server random number as part of the ECDH key agreement scheme.
        - op_code_value: "0x21"
          definition: Key Exchange KDF
          operand_section: 4.4.4.34
          description: Requests the exchange of keys using KDF or as part of the ECDH key agreement scheme.
        - op_code_value: "0x22"
          definition: Key Exchange KDF Response
          operand_section: 4.4.4.35
          description: Used by the AC Server to provide the KDF parameters.
        - op_code_value: "0x23"
          definition: Set AC Client Nonce Fixed
          operand_section: 4.4.4.36
          description: Sets the fixed part of the AC Client nonce.
        - op_code_value: 0x24 – 0xDC
          definition: RFU
          operand_section: N/A
          description: These values are reserved for future use.
        - op_code_value: "0xDD"
          definition: Get ATT_MTU
          operand_section: 4.4.4.37
          description: Requests the negotiated ATT_MTU size that can be used by the AC Client to optimize communication.
        - op_code_value: "0xDE"
          definition: ATT_MTU Response
          operand_section: 4.4.4.38
          description: Used by the AC Server to provide the negotiated ATT_MTU.
        - op_code_value: "0xDF"
          definition: Initiate Pairing
          operand_section: 4.4.4.39
          description: Requests the initiation of the pairing procedure by the AC Server.
        - op_code_value: 0xE0 – 0xFF
          definition: Manufacturer-specific Opcodes
          operand_section: N/A
          description: These values are reserved for manufacturer-specific use.

    - name: ACS CP procedure requirements
      description: The requirements of the opcodes and operands for the ACS CP procedures are defined below.
      section_title: ACS Control Point procedure requirements
      table_caption: ACS CP procedure requirements (Requests)
      values:
        - opcode: Get All Active Descriptors
          procedure_section: 4.4.3.1
          opcode_requirement: C.1
          operand: N/A
          operand_requirement: N/A
          description: N/A
        - opcode: Get Restriction Map Descriptor
          procedure_section: 4.4.3.2
          opcode_requirement: C.1
          operand: Restriction_Map_ID Resource_Handle_Filter
          operand_requirement: M
          description: N/A
        - opcode: Get Restriction Map ID List
          procedure_section: 4.4.3.3
          opcode_requirement: C.1
          operand: N/A
          operand_requirement: N/A
          description: N/A
        - opcode: Activate Restriction Map
          procedure_section: 4.4.3.4
          opcode_requirement: C.2
          operand: Restriction_Map_ID
          operand_requirement: M
          description: N/A
        - opcode: Get Resource Handle To UUID Map
          procedure_section: 4.4.3.5
          opcode_requirement: C.3
          operand: N/A
          operand_requirement: N/A
          description: N/A
        - opcode: Get Service And Characteristic UUIDs For Characteristic Resource Handle
          procedure_section: 4.4.3.6
          opcode_requirement: C.3
          operand: Characteristic_Resource_Handle
          operand_requirement: M
          description: N/A
        - opcode: Get Information Security Configuration Descriptor
          procedure_section: 4.4.3.7
          opcode_requirement: C.1
          operand: Information_Security_Configuration_ID_Filter
          operand_requirement: M
          description: N/A
        - opcode: Get Key Descriptor
          procedure_section: 4.4.3.8
          opcode_requirement: C.4
          operand: Key_ID_Filter
          operand_requirement: M
          description: N/A
        - opcode: Get Current Key List
          procedure_section: 4.4.3.9
          opcode_requirement: C.4
          operand: N/A
          operand_requirement: N/A
          description: N/A
        - opcode: Start Key Exchange
          procedure_section: 4.4.3.10
          opcode_requirement: C.5
          operand: Key_ID Selected_Confirmation_Method Selected_Confirmation_Action
          operand_requirement: M
          description: N/A
        - opcode: Invalidate All Established Security
          procedure_section: 4.4.3.11
          opcode_requirement: C.6
          operand: N/A
          operand_requirement: N/A
          description: N/A
        - opcode: Invalidate Key
          procedure_section: 4.4.3.12
          opcode_requirement: C.5 and C.6
