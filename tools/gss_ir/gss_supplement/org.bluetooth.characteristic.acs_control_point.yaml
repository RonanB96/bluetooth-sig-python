          operand_requirement: M
          description: N/A
        - opcode: Abort
          procedure_section: 4.4.3.13
          opcode_requirement: C.7
          operand: N/A
          operand_requirement: N/A
          description: N/A
        - opcode: Set Security Controls Switch
          procedure_section: 4.4.3.14
          opcode_requirement: C.8
          operand: Switch_State
          operand_requirement: M
          description: N/A
        - opcode: Get Key URI
          procedure_section: 4.4.3.15
          opcode_requirement: C.9
          operand: Key_ID
          operand_requirement: N/A
          description: N/A
        - opcode: Get ACS Feature
          procedure_section: 4.4.3.16
          opcode_requirement: M
          operand: N/A
          operand_requirement: N/A
          description: N/A
        - opcode: Key Exchange ECDH
          procedure_section: 4.4.3.17.1.1
          opcode_requirement: C.10
          operand: Key_ID AC_Client_Public_Key
          operand_requirement: M
          description: N/A
        - opcode: Key Exchange ECDH Confirmation Code
          procedure_section: 4.4.3.17.1.2
          opcode_requirement: C.10
          operand: Key_ID AC_Client_Confirmation_Code
