# Supplement: the SIG GSS repository has no document for this characteristic.
# Source: Core Specification 6.3, Vol 3, Part C, 12.4 Central Address Resolution characteristic (Table 12.7).
characteristic:
  identifier: org.bluetooth.characteristic.gap.central_address_resolution
  name: Central Address Resolution
  description: |-
    The Central Address Resolution characteristic defines whether the device supports privacy with address resolution.
    The structure of this characteristic is defined below.
  structure:
    - field: Central Address Resolution Support
      type: uint8
      size: "1"
      description: See \autoref{sec:org.bluetooth.characteristic.gap.central_address_resolution/field/central_address_resolution_support}.
  fields:
    - name: Central Address Resolution Support
      description: The values of this field are defined below.
      values:
        - value: "0"
          description: address resolution is not supported in this device
        - value: "1"
          description: address resolution is supported in this device
        - value: 2–255
          description: Reserved for Future Use
