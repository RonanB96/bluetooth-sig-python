# Supplement: the SIG GSS repository has no document for this characteristic.
# Source: Electronic Shelf Label Service 1.0.1, Section 3.5 (Table 3.2); Bluetooth Assigned Numbers display_types.
characteristic:
  identifier: org.bluetooth.characteristic.esl_display_information
  name: ESL Display Information
  description: |-
    The ESL Display Information characteristic value consists of an array of one or more Display Data Structures.
    As each Display Data Structure has a fixed length of 5 octets, the total length of the Display Information characteristic value, measured in octets, is five times the number of displays supported by the ESL. The maximum number of displays that could be represented in the characteristic value is therefore 102 displays.
    The value of the Display_Type field is from an enumeration maintained in the Bluetooth SIG Assigned Numbers \RefRef{assigned_numbers}.
    The structure of this characteristic is defined below.
  structure:
    - field: Width
      type: uint16
      size: "2"
      description: |-
        The width of the display in pixels.
        The sequence of fields from Width through Display Type is repeated for each Display Data Structure in the array.
    - field: Height
      type: uint16
      size: "2"
      description: The height of the display in pixels.
    - field: Display Type
      type: uint8
      size: "1"
      description: See \autoref{sec:org.bluetooth.characteristic.esl_display_information/field/display_type}.
  fields:
    - name: Display Type
      description: The values of this field are defined below.
      values:
        - value: "0x01"
          description: black white
        - value: "0x02"
          description: three gray scale
        - value: "0x03"
          description: four gray scale
        - value: "0x04"
          description: eight gray scale
        - value: "0x05"
          description: sixteen gray scale
        - value: "0x06"
          description: red black white
        - value: "0x07"
          description: yellow black white
        - value: "0x08"
          description: red yellow black white
        - value: "0x09"
          description: seven color
        - value: "0x0A"
          description: sixteen color
        - value: "0x0B"
          description: full RGB
        - value: 0x0C–0xFF
          description: Reserved for Future Use
