# Supplement: the SIG GSS repository has no document for this characteristic.
# Source: Volume Control Service 1.0.1, 3.2 Volume Control Point (Tables 3.3–3.10).
characteristic:
  identifier: org.bluetooth.characteristic.volume_control_point
  name: Volume Control Point
  description: |-
    The Volume Control Point characteristic is used to request a specific procedure to be executed by the server when a value is written to it.
    The structure of this characteristic is defined below.
  structure:
    - field: Opcode
      type: uint8
      size: "1"
      description: See \autoref{sec:org.bluetooth.characteristic.volume_control_point/field/opcode}
    - field: Change_Counter
      type: uint8
      size: "1"
      description: |-
        Allowed range is 0x00 to 0xFF.
    - field: Volume_Setting
      type: uint8
      size: "0 or 1"
      description: |-
        Allowed range is 0x00 to 0xFF.
        Present if Op Code is 0x04
  fields:
    - name: Opcode
      description: The values of this field are defined below.
      section_title: Volume Control Point procedure requirements
      table_caption: Volume Control Point procedure requirements
      values:
        - opcode_value: "0x00"
          opcode: Relative Volume Down
          requirement: M
          operand: Change_Counter
        - opcode_value: "0x01"
          opcode: Relative Volume Up
          requirement: M
          operand: Change_Counter
        - opcode_value: "0x02"
          opcode: Unmute/Relative Volume Down
          requirement: M
          operand: Change_Counter
        - opcode_value: "0x03"
          opcode: Unmute/Relative Volume Up
          requirement: M
          operand: Change_Counter
        - opcode_value: "0x04"
          opcode: Set Absolute Volume
          requirement: M
          operand: Change_Counter, Volume_Setting
        - opcode_value: "0x05"
          opcode: Unmute
          requirement: M
          operand: Change_Counter
        - opcode_value: "0x06"
          opcode: Mute
          requirement: M
          operand: Change_Counter
