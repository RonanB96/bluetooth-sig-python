          description: Annunciation Status Changed Part 2 of 2
        - value: "0x0359"
          description: ISF Profile Template Time Block Changed
        - value: "0x0365"
          description: I2CHO Ratio Profile Template Time Block Changed
        - value: "0x036A"
          description: Target Glucose Range Profile Template Time Block Changed
        - value: "0x0395"
          description: Priming Started
        - value: "0x039A"
          description: Priming Done
        - value: "0x03A6"
          description: Data Corruption
        - value: "0x03A9"
          description: Pointer Event
        - value: "0x03C0"
          description: Bolus Template Changed Part 1 of 2
        - value: "0x03CF"
          description: Bolus Template Changed Part 2 of 2
        - value: "0x03F3"
          description: TBR Template Changed
        - value: "0x03FC"
          description: Max Bolus Amount Changed
        - value: 0xF000–0xFFF0
          description: Manufacturer Reserved Hamming Code Value Range
        - value: All not already defined Hamming code values within 0x0000 and 0xFFFF
          description: RFU
        - value: All other values
          description: Prohibited
    - name: Recording Reason
      description: The values of this field are defined below.
      values:
        - value: "0x0F"
          description: Undetermined — The reason is undetermined.
        - value: "0x33"
          description: Set Date Time
        - value: "0x3C"
          description: Periodic Recording
        - value: "0x55"
          description: Date Time Loss
        - value: All not already defined Hamming code values within 0x00 and 0xFF
          description: RFU
        - value: All other values
          description: Prohibited
    - name: Time Offset
      description: See \autoref{sec:org.bluetooth.characteristic.glucose_measurement/field/time_offset}.
    - name: Bolus Type
      description: The values of this field are defined below.
      values:
        - value: "0x0F"
          description: Undetermined
        - value: "0x33"
          description: Fast
        - value: "0x3C"
          description: Extended
        - value: "0x55"
          description: Multiwave
        - value: All not already defined Hamming code values within 0x00 and 0xFF
          description: RFU
        - value: All other values
          description: Prohibited
    - name: Bolus Activation Type
      description: The values of this field are defined below.
      values:
        - value: "0x0F"
          description: Undetermined — The activation type is undetermined.
        - value: "0x33"
          description: Manual Bolus — The bolus was defined by the user.
        - value: "0x3C"
          description: Recommended Bolus — The bolus was recommended by a calculation algorithm (e.g., a bolus calculator) and confirmed by the user.
        - value: "0x55"
          description: Manually Changed Recommended Bolus — The user changed a recommended bolus.
        - value: "0x5A"
          description: Commanded Bolus — The bolus was activated without user interaction (e.g., by an APDS).
        - value: All not already defined Hamming code values within 0x00 and 0xFF
          description: RFU
        - value: All other values
          description: Prohibited
    - name: Bolus End Reason
      description: The values of this field are defined below.
      values:
        - value: "0x0F"
          description: Undetermined — The reason why the bolus ended is undetermined.
        - value: "0x33"
          description: Programmed Amount Delivered — The programmed amount was delivered completely.
        - value: "0x3C"
          description: Canceled — The bolus was canceled by an interaction (e.g., by the user via a remote control or the device itself).
        - value: "0x55"
          description: Error Abort — The bolus was aborted due to an error.
        - value: All not already defined Hamming code values within 0x00 and 0xFF
          description: RFU
        - value: All other values
          description: Prohibited
    - name: TBR Type
      description: The values of this field are defined below.
      values:
        - value: "0x0F"
          description: Undetermined
        - value: "0x33"
          description: Absolute
        - value: "0x3C"
          description: Relative
        - value: All not already defined Hamming code values within 0x00 and 0xFF
          description: RFU
        - value: All other values
          description: Prohibited
    - name: Basal Delivery Context
      description: The values of this field are defined below.
      values:
        - value: "0x0F"
          description: Undetermined — The basal delivery context is undetermined.
        - value: "0x33"
          description: Device Based — The current basal rate was set directly on the Insulin Delivery Device.
        - value: "0x3C"
          description: Remote Control — The current basal rate was set via a remote control (i.e., an external device).
        - value: "0x55"
          description: Artificial Pancreas (AP) Controller — The current basal rate was set by an AP Controller as part of an Artificial Pancreas Device System (APDS).
        - value: All not already defined Hamming code values within 0x00 and 0xFF
          description: RFU
        - value: All other values
          description: Prohibited
    - name: TBR End Reason
      description: The values of this field are defined below.
