        - value: "0x00A5"
          description: TBR Adjustment Started
        - value: "0x00AA"
          description: TBR Adjustment Ended
        - value: "0x00C3"
          description: TBR Adjustment Changed
        - value: "0x00CC"
          description: Profile Template Activated
        - value: "0x00F0"
