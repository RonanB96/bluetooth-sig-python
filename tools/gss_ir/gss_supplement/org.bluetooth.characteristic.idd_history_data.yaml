        - value: "0x00FF"
          description: Total Daily Insulin Delivery
        - value: "0x0303"
          description: Therapy Control State Changed
        - value: "0x030C"
          description: Operational State Changed
        - value: "0x0330"
          description: Reservoir Remaining Amount Changed
        - value: "0x033F"
          description: Annunciation Status Changed Part 1 of 2
