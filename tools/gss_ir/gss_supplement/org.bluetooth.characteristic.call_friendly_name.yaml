# Supplement: the SIG GSS repository has no document for this characteristic.
# Source: Telephone Bearer Service 1.0, Section 3.16.
characteristic:
  identifier: org.bluetooth.characteristic.call_friendly_name
  name: Call Friendly Name
  description: |-
    The Call Friendly Name characteristic returns the Call Index and friendly name (as determined by the server) of the incoming or outgoing call. The Friendly_Name field is a UTF-8 string. The format of the characteristic is shown in Table 3.16.
    The structure of this characteristic is defined below.
  structure:
    - field: Call Index
      type: uint8
      size: "1"
      description: |-
        Each telephone call is identified by a Call_Index value that is unique per service.
        When the service instantiates, the Call_Index shall be a number from 1 to 255.
        The Call_Index of 0 is reserved.
    - field: Friendly Name
      type: utf8s
      size: variable
      description: UTF-8 string
