# Supplement: the SIG GSS repository has no document for this characteristic.
# Source: Gaming Audio Profile 1.0.1, 4.7.3 UGT Features (Tables 4.6–4.7).
characteristic:
  identifier: org.bluetooth.characteristic.ugt_features
  name: UGT Features
  description: |-
    The UGT Features characteristic exposes the UGT features supported by the GMA Server.
    The structure of this characteristic is defined below.
  structure:
    - field: Features
      type: boolean[8]
      size: "1"
      description: See \autoref{sec:org.bluetooth.characteristic.ugt_features/field/features}.
  fields:
    - name: Features
      description: The bits of this field are defined below.
      values:
        - bit: "0"
          description: |-
            UGT Source feature support
            0 = Not supported
            1 = Supported
        - bit: "1"
          description: |-
            UGT 80 kbps Source feature support
            0 = Not supported
            1 = Supported
        - bit: "2"
          description: |-
            UGT Sink feature support
            0 = Not supported
            1 = Supported
        - bit: "3"
          description: |-
            UGT 64 kbps Sink feature support
            0 = Not supported
            1 = Supported
        - bit: "4"
          description: |-
            UGT Multiplex feature support
            0 = Not supported
            1 = Supported
        - bit: "5"
          description: |-
            UGT Multisink feature support
            0 = Not supported
            1 = Supported
        - bit: "6"
          description: |-
            UGT Multisource feature support
            0 = Not supported
            1 = Supported
        - bit: "7"
          description: RFU
