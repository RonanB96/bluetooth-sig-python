# Supplement: the SIG GSS repository has no document for this characteristic.
# Source: HID Service Specification 1.1, 2.11 HID Control Point characteristic, Table 2.17.
characteristic:
  identifier: org.bluetooth.characteristic.hid_control_point
  name: HID Control Point
  description: |-
    The HID Control Point characteristic is a control-point attribute that defines the following HID Commands when written:
    Suspend (Section 7.4.2, Human Interface Device Profile [5])
    Exit Suspend (Section 7.4.2, Human Interface Device Profile [5])
    Enable SCI Default mode
    Enable SCI Fast mode
    Enable SCI Low Power mode
    Enable SCI Full Range mode
    The structure of this characteristic is defined below.
  structure:
    - field: HID Control Point
      type: uint8
      size: "1"
      description: See \autoref{sec:org.bluetooth.characteristic.hid_control_point/field/hid_control_point}.
  fields:
    - name: HID Control Point
      description: The values of this field are defined below.
      values:
        - value: "0x00"
          description: |-
            Suspend
            Informs HID Device that HID Host is entering the Suspend State (as defined in Section 7.4.2, HID Profile Specification [5])
        - value: "0x01"
          description: |-
            Exit Suspend
            Informs HID Device that HID Host is exiting the Suspend State (as defined in Section 7.4.2, HID Profile Specification [5])
        - value: "0x02"
          description: |-
            Enable SCI Default mode
            Configures the HID Device that the HID Host is requesting to activate and use HID SCI Default mode
        - value: "0x03"
          description: |-
            Enable SCI Fast mode
            Configures the HID Device that the HID Host is requesting to activate and use HID SCI Fast mode
        - value: "0x04"
          description: |-
            Enable SCI Low Power mode
            Configures the HID Device that the HID Host is requesting to activate and use HID SCI Low Power mode
        - value: "0x05"
          description: |-
            Enable SCI Full Range mode
            Configures the HID Device that the HID Host is requesting to activate and use HID SCI Full Range mode
        - value: 0x06–0xFF
          description: Reserved for Future Use
