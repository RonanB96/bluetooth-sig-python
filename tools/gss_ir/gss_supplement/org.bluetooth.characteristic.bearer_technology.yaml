# Supplement: the SIG GSS repository has no document for this characteristic.
# Source: Telephone Bearer Service 1.0, Section 3.3. Value codes: Assigned Numbers §6.10.2.
# Section 3.3 and Assigned Numbers §6.10.2 do not state an octet size.
# The uint8 size and the code range are taken from Zephyr enum __packed bt_bearer_tech
# and read_technology, include/zephyr/bluetooth/assigned_numbers.h and subsys/bluetooth/audio/tbs.c.
# Zephyr's comment marks 0x0A–0xFF as reserved. 0x00 is not a named §6.10.2 value.
characteristic:
  identifier: org.bluetooth.characteristic.bearer_technology
  name: Bearer Technology
  description: |-
    The Bearer Technology characteristic returns information about the type of technology that is being used for this telephone bearer. Terms such as 3G, 4G, Long Term Evolution (LTE), and Wi-Fi are examples of values and are defined in the Bluetooth assigned numbers [1].
    The structure of this characteristic is defined below.
  structure:
    - field: Bearer Technology
      type: uint8
      size: "1"
      description: See \autoref{sec:org.bluetooth.characteristic.bearer_technology/field/bearer_technology}.
  fields:
    - name: Bearer Technology
      description: The values of this field are defined below.
      values:
        - value: "0x00"
          description: Reserved for Future Use
        - value: "0x01"
          description: 3G
        - value: "0x02"
          description: 4G
        - value: "0x03"
          description: LTE
        - value: "0x04"
          description: Wi-Fi
        - value: "0x05"
          description: 5G
        - value: "0x06"
          description: GSM
        - value: "0x07"
          description: CDMA
        - value: "0x08"
          description: 2G
        - value: "0x09"
          description: WCDMA
        - value: 0x0A–0xFF
          description: Reserved for Future Use
